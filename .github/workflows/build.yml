name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Build Docker image
        run: docker build -t fullstack-app:latest .

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/learning-full-stack
            git pull origin main
            ./mvnw clean install -DskipTests
            docker build -t fullstack-app:latest .
            docker rm -f fullstack-app || true
            docker run -d \
              --name fullstack-app \
              --network fullstack-net \
              -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/syscomz \
              fullstack-app:latest
